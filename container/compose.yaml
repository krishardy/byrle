# The development Postgres. Started by `make start-dev-db`, which sets DEV_DB_USER,
# DEV_DB_PASSWORD, DEV_DB_NAME and DEV_DB_PORT from the Makefile. byrle runs on the host,
# from `make start-dev-server`.
#
# Postgres reads them only when it creates the volume. To change them after that, delete
# the volume: podman-compose down -v
#
# They are not marked required with `:?`, because podman-compose reads the whole file for
# every command, and `logs` and `down` would then fail in a shell without them. The port
# falls back to the Makefile's default, 5433, because an empty one does not parse.

name: byrle-dev

services:
  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: ${DEV_DB_USER}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
      POSTGRES_DB: ${DEV_DB_NAME}
    # Postgres 18 keeps its data in /var/lib/postgresql/18/docker, and its entrypoint
    # refuses to start with a mount at /var/lib/postgresql/data.
    volumes:
      - db:/var/lib/postgresql
    # For host tools such as psql and `make sqlx-prepare` against this database.
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5433}:5432"
    # Over TCP rather than the socket: see scripts/make/lib/postgres.sh.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 5s
      retries: 60

volumes:
  db:
