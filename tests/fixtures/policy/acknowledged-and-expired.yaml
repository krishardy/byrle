# Two loosenings of the same rule, one answered for and still in force, one that has run
# out. Both are audited; only the lapsed one warns.
version: 1
floor:
  npm:
    known_malware: block
defaults:
  install_scripts: block
ecosystems:
  npm:
    install_scripts:
      action: allow
      loosens_global: true
      reason: "reviewed by security"
      expires: "2026-11-30"
  pypi:
    install_scripts:
      action: warn
      loosens_global: true
      reason: "vendored build steps"
      expires: "2026-08-01"
