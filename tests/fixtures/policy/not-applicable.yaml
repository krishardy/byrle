# §5.5's example. Go modules have no install step, so install_scripts reports N/A rather
# than the loosening it would be anywhere else. The npm block is the same override, to
# show the two side by side.
version: 1
floor:
  npm:
    known_malware: block
defaults:
  install_scripts: block
ecosystems:
  golang:
    install_scripts: allow
  npm:
    install_scripts: allow
