# The ordinary shape of a real config: defaults say little and ecosystems fill it in.
# Nothing was loosened, because there was nothing above to loosen.
version: 1
floor:
  npm:
    known_malware: block
defaults:
  known_malware: block
ecosystems:
  npm:
    install_scripts: allow
    cooldown: { action: allow, days: 0 }
    provenance_required: false
