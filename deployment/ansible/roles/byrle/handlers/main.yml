- name: Restart byrle
  ansible.builtin.systemd_service:
    name: byrle.service
    state: restarted
    daemon_reload: true

- name: Reload byrle
  ansible.builtin.systemd_service:
    name: byrle.service
    state: reloaded

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    state: reloaded
