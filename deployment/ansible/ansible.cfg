# Read when ansible-playbook runs from this directory.
[defaults]
inventory = inventory.yml
roles_path = roles
# The hosts are named in the inventory, so their keys are expected to be known.
host_key_checking = True

[ssh_connection]
# Runs each module over the open connection. Becoming the unprivileged postgres user then
# needs no temporary files that user can read.
pipelining = True
