version: 1

denials:
  - purl: "pkg:npm/chalk@5.6.1"
    reason: "compromised release, Sept 2025"
  - purl: "pkg:pypi/ctx@0.1.2"
    reason: "credential exfiltration, confirmed"

floor:
  npm:
    known_malware: block
    provenance_required: true
  pypi:
    known_malware: block
    install_scripts: quarantine

defaults:
  known_malware: block
  cooldown: { action: quarantine, days: 7 }
  install_scripts: warn
  provenance_required: false

ecosystems:
  npm:
    install_scripts:
      action: allow
      loosens_global: true
      reason: "node-gyp builds until we vendor prebuilts"
      expiress: "2026-11-30"
  cargo:
    cooldown: { action: block, days: 14 }

packages:
  - match: { ecosystem: npm, name: "@mycompany/*" }
    set: { cooldown: { days: 0 } }
    reason: "internal, published by our CI"
    permanent: true
    added_by: alice

  - match: { ecosystem: npm, purl: "pkg:npm/chalk@5.6.2" }
    set: { cooldown: { days: 0 } }
    reason: "reviewed by security, fixes GHSA-xxxx"
    expires: "2026-10-15"
    added_by: alice

  - match: { ecosystem: pypi, name: "torch", has_install_scripts: true }
    set: { install_scripts: allow, cooldown: { action: warn, days: 3 } }
    reason: "vendored CUDA build steps, reviewed"
    expires: "2026-11-01"
    added_by: bob
