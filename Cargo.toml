[package]
name = "byrle"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The spike harness is a standalone crate kept as evidence, not a member.
[workspace]
exclude = ["spikes/config-format"]

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
# Parses the command line. Default features off: no colour and no typo suggestions, which
# adds four crates rather than eleven. See docs/engineering_decisions/cli-parser-clap.md.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# Turns the CVSS vectors OSV records carry into the numbers `max_cvss` compares. v3 and v4.
cvss = { version = "3.0.0", default-features = false, features = ["std", "v3", "v4"] }
bzip2 = "0.6.1"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Random bytes for proxy tokens, from the operating system. Already built through rand_core,
# so it adds no crate. See src/account.rs.
getrandom = "0.3.4"
jiff = "0.2.35"
purl = { version = "0.1.6", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
# Orders the versions in OSV `SEMVER` ranges. SemVer 2.0 ignores build metadata and this crate
# compares it, so it is stripped before comparing; see src/intel/range.rs.
semver = "1.0.28"
# Postgres only, and rustls rather than native-tls so there is one TLS stack in the tree.
# `macros` is what checks SQL against the real schema at compile time; see
# docs/engineering_decisions/storage-sqlx-postgres.md.
# Held at 0.8: sqlx 0.9 requires rustc 1.94 and kani 0.67 compiles with 1.93. See
# docs/engineering_decisions/sqlx-0-8-and-rsa-advisory.md.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Reads OSV's per-ecosystem bundle, `npm/all.zip`. All 228,951 entries are deflate. `deflate-flate2`
# reads it through flate2, already in the tree. `deflate` would add zopfli, which only compresses,
# and the default features add aes-crypto, bzip2, lzma, ppmd, xz and zstd.
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
# Verifies npm and PyPI attestations against Sigstore's production root, embedded in the
# crate. Pinned exactly: 0.12.0 and 0.13.0 shipped on one day. Default features off: no TLS
# stack and no TUF client, since nothing here fetches. `sigstore` 0.14.0 verified none of
# three real attestations and compiles `rsa`; see
# docs/engineering_decisions/sigstore-verifier.md.
sigstore-verify = { version = "=0.14.0", default-features = false }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
utoipa = { version = "6.0.0", features = ["preserve_order"] }
maud = "0.27.0"
serde_urlencoded = "0.7.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
# The binary's allocator. A release is a static musl binary, and musl's own allocator is
# slow under many threads; see docs/engineering_decisions/release-provenance.md.
mimalloc = "0.1.52"
# killpg, to end a detector with the processes it started. Already in the tree through
# tokio and others.
libc = "0.2.189"

[dev-dependencies]
# Test builds only. `sqlx-core` turns on `tracing`'s `log` feature, which gives every event a
# branch that hands it to `log` when no tracing subscriber takes it. Tests install no tracing
# subscriber, `log-always` takes that branch, and `test_support` installs the `log` logger,
# with `ctor`, before any test runs; a test captures logs from it. Without all three no test
# reaches the branch, and `make coverage` counts it against every log call. See
# docs/engineering_decisions/coverage-counts-library-code-only.md.
tracing = { version = "0.1.44", features = ["log-always"] }
log = "0.4.34"
ctor = "1.0.13"
aws-lc-rs = "1.18.1"

# `make mutants` builds one copy of the crate per mutant. No debug information: a mutant is
# caught or missed by its tests, and nobody attaches a debugger to it.
[profile.mutants]
inherits = "dev"
debug = false

[lints.rust]
# `coverage` is set by cargo-llvm-cov, which `make coverage` runs. Declared so the
# network- and corpus-dependent tests can be compiled out of a coverage build without
# tripping the unexpected-cfg lint. `coverage_nightly` is set by it on nightly, where test
# code is marked `coverage(off)`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)', 'cfg(kani)'] }
