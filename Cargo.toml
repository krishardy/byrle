[package]
name = "waharoa"
version = "0.1.0"
edition = "2024"

# The spike harness is a standalone crate kept as evidence, not a member.
[workspace]
exclude = ["spikes/config-format"]

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
purl = "0.1.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
