# Build, attest and publish a release when a v* tag is pushed. Run by hand, it builds the
# binaries and stops: nothing is attested or published.
#
# Each architecture's static binary is built on its own runner, in the pinned rust:1-alpine
# image `make release-binary` starts, and attested with SLSA build provenance through
# Sigstore. The GitHub release carries the
# tarballs; the image on ghcr.io is built from the same attested binaries, not a second
# build, and is attested by digest. See docs/engineering_decisions/0108-release-provenance.md.
#
# Actions are pinned by commit, with the release each commit is in a comment. Only GitHub's own
# actions run here: the image is built and pushed by `make release-image`, with the docker CLI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.ref_type == 'tag'
        run: make release-check TAG="$GITHUB_REF_NAME"
      - run: make release-binary
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: dist/byrle-*
          if-no-files-found: error

  release:
    needs: binaries
    if: github.ref_type == 'tag'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --verify-tag
          --notes "Verify a download with: gh attestation verify <file> --repo $GITHUB_REPOSITORY
          --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml
          --source-ref refs/tags/$GITHUB_REF_NAME --deny-self-hosted-runners"
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    needs: binaries
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: make release-image-context
      - id: image
        run: make release-image TAG="$GITHUB_REF_NAME" REPO="$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
