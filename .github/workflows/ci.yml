# Lint, unit tests, the offline query cache check, and a pull request's sign-offs.
#
# Each job runs a `make` target, so what CI checks is what a contributor runs. The logic
# lives in `scripts/make/`, per CLAUDE.md; nothing here is more than an invocation.
#
# `make coverage`, `make verify` and `make test-integration` are deliberately not here.
# See docs/engineering_decisions/0044-ci-gates.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The runner is named, not `ubuntu-latest`, so a new Ubuntu is taken on when chosen; and
# actions are pinned by commit, with the release each commit is in a comment.
#
# Each job's tools come from `make ci-setup JOB=<job>`, whose versions are pinned in
# scripts/make/lib/ beside the ones make dev-setup uses. rust-cache restores first, so a
# cached sqlx-cli is found rather than built again.
env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make ci-setup JOB=lint
      - run: make lint

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make ci-setup JOB=test
      - run: make test

  sqlx:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make ci-setup JOB=sqlx
      # Starts its own Postgres container, so no `services:` block: the same script a
      # contributor runs is the one that runs here.
      - run: make sqlx-prepare ARGS=--check

  # Pull requests only: the commits a pull request adds, each signed off by its author.
  signed-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: make commit-fixup BASE="origin/$BASE_REF" CHECKS=sign-off
        env:
          BASE_REF: ${{ github.base_ref }}
